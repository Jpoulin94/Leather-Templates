<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leather Templates</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z" /><circle cx="8.5" cy="7.5" r=".9" /><circle cx="12" cy="7.5" r=".9" /><circle cx="15.5" cy="7.5" r=".9" /><circle cx="8.5" cy="11" r=".9" /><circle cx="8.5" cy="14.5" r=".9" /></svg>
        <span>Leather Templates</span>
      </div>
      <input id="projectName" class="project-name" type="text" spellcheck="false" aria-label="Project name" />
      <span id="saveState" class="save-state"></span>
      <div class="spacer"></div>
      <div class="icon-group">
        <button id="btnUndo" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
        <button id="btnRedo" class="icon-btn" title="Redo (Ctrl+Y)" aria-label="Redo"></button>
      </div>
      <div class="seg units" role="radiogroup" aria-label="Units">
        <button data-units="mm" role="radio">mm</button>
        <button data-units="in" role="radio">in</button>
      </div>
      <div class="menu-wrap">
        <button id="btnFile" class="ghost" aria-haspopup="menu">File <span class="caret"></span></button>
        <div class="menu" id="fileMenu" role="menu" hidden>
          <button data-file="new" role="menuitem">New project</button>
          <button data-file="open" role="menuitem">Open saved project…</button>
          <hr />
          <button data-file="download" role="menuitem">Download project file</button>
          <button data-file="load" role="menuitem">Load project file…</button>
        </div>
      </div>
      <button id="btnSave" class="ghost" title="Save in this browser (Ctrl+S)">Save</button>
      <button id="btnExport" class="primary">Export</button>
      <input id="fileInput" type="file" accept=".json,application/json" hidden />
    </header>

    <main class="layout">
      <aside class="sidebar" id="leftPanel"></aside>

      <section class="stage">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>

        <nav class="rail" id="rail" aria-label="Tools"></nav>

        <div class="legend" aria-hidden="true">
          <span><i class="sw holes"></i>Holes</span>
          <span><i class="sw stitch"></i>Stitch line</span>
          <span><i class="sw none"></i>Cut line</span>
        </div>

        <div class="zoom" id="zoom"></div>
        <div id="hint" class="hint"></div>
      </section>

      <aside class="inspector" id="rightPanel"></aside>
    </main>

    <dialog id="dialog">
      <form method="dialog">
        <h3 id="dialogTitle"></h3>
        <div id="dialogBody"></div>
        <menu id="dialogButtons"></menu>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/geometry.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/model.js"></script>
    <script src="js/boolean.js"></script>
    <script src="js/resolve.js"></script>
    <script src="js/render.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
